<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="초록친구 로고">
  <title>초록친구</title>
  <!-- 심볼: 잎 + 화분 -->
  <g>
    <!-- 화분 (브라운) -->
    <path d="M40 74 h56 l-8 34 a6 6 0 0 1 -6 5 h-22 a6 6 0 0 1 -6 -5 z" fill="#5D4037"/>
    <!-- 화분 테두리 -->
    <rect x="36" y="64" width="64" height="14" rx="7" fill="#5D4037"/>
    <!-- 흙 (연초록 약식 생략, 화분 위 잎으로 표현) -->
    <!-- 잎 큰 잎 (초록) -->
    <path d="M68 64 C 46 50 44 24 64 14 C 78 34 80 50 68 64 Z" fill="#2E7D32"/>
    <!-- 잎 작은 잎 (연초록) -->
    <path d="M68 64 C 84 54 102 52 104 34 C 88 32 74 44 68 64 Z" fill="#A5D6A7"/>
    <!-- 잎맥 -->
    <path d="M66 60 C 60 46 60 32 64 18" fill="none" stroke="#F5F0E1" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 워드마크: 초록친구 (초록, 굵게) -->
  <text x="128" y="84" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="64" font-weight="700" fill="#2E7D32" letter-spacing="2">초록친구</text>
</svg>
