name: 자동 글 발행 (주 3회)

# 월·수·금 00:00 UTC = 09:00 KST. 큐가 비면 아무 변경 없이 끝납니다.
on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: auto-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Seoul
        run: node scripts/auto/generate-article.mjs

      - name: 변경 있으면 커밋·푸시
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            slug=$(git status --porcelain articles/ | grep -E '\.html$' | head -n1 | sed -E 's#.*/([^/]+)\.html#\1#')
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[auto] 새 글: ${slug:-article}"
            git push
          else
            echo "변경 없음 — 커밋 건너뜀(큐 비었거나 이미 발행)."
          fi
