name: 복붙 게시물 생성 (매일)

# 매일 00:00 UTC = 09:00 KST. API 불필요(템플릿 생성).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 오늘 날짜(KST) 계산
        id: date
        run: echo "iso=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 복붙 게시물 생성
        env:
          DAILY_DATE: ${{ steps.date.outputs.iso }}
          TZ: Asia/Seoul
        run: node scripts/auto/generate-posts.mjs

      - name: 변경 있으면 커밋·푸시
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[auto] 복붙 게시물 ${{ steps.date.outputs.iso }}"
            git push
          else
            echo "변경 없음 — 오늘 게시물이 이미 있습니다."
          fi
